name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Sources stay LF on Windows too (.gitattributes says so as well): the architecture tests
      # read them as text.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      # Unit and scenario tests, and the architecture ratchets (tests/architecture.rs).
      - run: cargo test --locked --no-fail-fast

  # The static build through the Dockerfile the release uses (toolchain versions live there):
  # one target, no packages; the toolchain layers come from the Actions cache.
  static-linux:
    name: static musl build (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: dist
          build-args: |
            TARGETS=x86_64-unknown-linux-musl
            NO_PACKAGES=1
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      # The static check ran in the build (tools/release-local.sh); the binary runs here.
      - run: |
          tar -xzf dist/swarmy-*-x86_64-unknown-linux-musl.tar.gz -C dist
          dist/swarmy-*-x86_64-unknown-linux-musl/swarmy --version
