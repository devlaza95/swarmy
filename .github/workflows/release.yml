name: Release

# A tag v<version> (the version in Cargo.toml) builds every target, packs archives, .deb and .rpm,
# SHA256SUMS, and publishes a GitHub Release with the notes of the CHANGELOG section (or the tag
# message). The Linux and Windows steps are those of tools/release-local.sh and tools/dist.sh.
# Optional, each skipped cleanly without its secrets: macOS signing and notarization
# (APPLE_*), the Homebrew tap update (HOMEBREW_TAP_TOKEN). packaging/README.md has the setup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  meta:
    name: check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: v
        run: |
          version=$(tools/dist.sh version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  linux:
    name: linux (musl, static) + .deb/.rpm
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      # The Dockerfile runs tools/release-local.sh linux with its pinned toolchain: the four
      # targets, each checked static (readelf: no INTERP, no NEEDED), the archives, the .deb and
      # the .rpm packages, into dist/ (what `docker build --output dist .` gives locally).
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=toolchain
      - run: |
          tar -xzf dist/swarmy-*-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/swarmy-*-x86_64-unknown-linux-musl/swarmy --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  windows:
    name: windows (x86_64, static CRT)
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      # +crt-static comes from .cargo/config.toml: no Visual C++ runtime to install.
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - run: target/x86_64-pc-windows-msvc/release/swarmy.exe --version
      - run: |
          tools/dist.sh docs target/x86_64-pc-windows-msvc/release/swarmy.exe
          tools/dist.sh archive x86_64-pc-windows-msvc target/x86_64-pc-windows-msvc/release/swarmy.exe
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macos (universal)
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
      - run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/swarmy \
            target/aarch64-apple-darwin/release/swarmy target/x86_64-apple-darwin/release/swarmy
          lipo -info target/universal-apple-darwin/release/swarmy
          target/universal-apple-darwin/release/swarmy --version
      - id: secrets
        name: Signing secrets present?
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          NOTARY: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
        run: |
          if [ -n "$P12" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_CERTIFICATE_P12 is not set: the macOS binary is not signed"
          fi
          if [ -n "$P12" ] && [ -n "$NOTARY" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"; else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign (Developer ID, hardened runtime)
        if: steps.secrets.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc"
          codesign --force --timestamp --options runtime --sign "$APPLE_DEVELOPER_ID" \
            target/universal-apple-darwin/release/swarmy
          codesign --verify --strict --verbose=2 target/universal-apple-darwin/release/swarmy
      - name: Notarize
        if: steps.secrets.outputs.notarize == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          # A bare binary cannot be stapled: Gatekeeper fetches the ticket online.
          ditto -c -k target/universal-apple-darwin/release/swarmy "$RUNNER_TEMP/swarmy-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/swarmy-notarize.zip" --wait \
            --apple-id "$APPLE_NOTARY_APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD"
      - run: |
          tools/dist.sh docs target/universal-apple-darwin/release/swarmy
          tools/dist.sh archive universal-apple-darwin target/universal-apple-darwin/release/swarmy
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish the release
    needs: [meta, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums, notes, formula
        run: |
          # The annotated tag (checkout leaves a lightweight copy): its message is the fallback notes.
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tools/dist.sh sums
          tools/dist.sh notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          tools/dist.sh formula
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "swarmy $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: formula
          path: dist/packaging/swarmy.rb
          if-no-files-found: error

  homebrew:
    name: update the Homebrew tap
    needs: [meta, release]
    if: needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - id: token
        name: Tap key present?
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$KEY" ] || [ -n "$TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice::neither HOMEBREW_TAP_DEPLOY_KEY nor HOMEBREW_TAP_TOKEN is set: the tap koorchik/homebrew-tap is not updated"
          fi
      - uses: actions/download-artifact@v8.0.2
        if: steps.token.outputs.set == 'true'
        with:
          name: formula
          path: formula
      # A deploy key with write access to the tap only (preferred), else a token.
      - uses: actions/checkout@v7.0.1
        if: steps.token.outputs.set == 'true'
        with:
          repository: koorchik/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          path: tap
      - name: Commit the formula
        if: steps.token.outputs.set == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p tap/Formula
          cp formula/swarmy.rb tap/Formula/swarmy.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/swarmy.rb
          if git diff --cached --quiet; then
            echo "the tap already has swarmy $VERSION"
            exit 0
          fi
          git commit -m "swarmy $VERSION"
          git push
