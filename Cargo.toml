[package]
name = "swarmy"
version = "0.2.8"
edition = "2024"
authors = ["Viktor Turskyi"]
description = "Real-time analytics dashboard for coding agents (Claude Code, Antigravity, Codex): live swarm, history, API-equivalent spend, weekly limits, and a vault for OAuth logins"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/koorchik/swarmy"
homepage = "https://github.com/koorchik/swarmy"
keywords = ["claude", "agents", "tui", "monitoring", "usage"]
categories = ["command-line-utilities", "development-tools"]
# What a crates.io package would carry (the README media and the tools stay in the repository).
include = ["/src", "/tests", "/Cargo.toml", "/Cargo.lock", "/clippy.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

# Enforced by `tools/check.sh` (clippy runs with -D warnings). Rules too costly to switch on at
# once are held by the ratchets in tests/architecture.rs instead: their counts may only fall.
[lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
# Production code never panics on a value it did not check (tests may: clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
default = ["bundled-sqlite"]
# Distributions that ship a system libsqlite3 can build with --no-default-features.
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
crossterm = "0.29.0"
directories = "6.0.0"
hex = "0.4.3"
owo-colors = "4.4.0"
ratatui = "0.30.2"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", default-features = false, features = ["cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "preserve_order"] }
sha2 = "0.11.1"
sysinfo = "0.40.4"
thiserror = "2.0.21"
toml = "1.0.0"
unicode-width = "0.2.3"

[target.'cfg(windows)'.dependencies]
# A file's identity (volume serial + file index), Windows' inode: safe wrappers, no unsafe here.
winapi-util = "0.1.11"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

# Linux packages wrap the static musl binary (tools/release-local.sh builds them; see
# packaging/README.md). The man page and completions are generated into dist/docs first.
[package.metadata.deb]
maintainer = "Viktor Turskyi"
section = "utils"
priority = "optional"
extended-description = """\
swarmy reads what Claude Code writes to disk (transcripts, session registry, .claude.json) \
across several config dirs and shows the live agent swarm, API-equivalent spend, weekly-limit \
attribution per project, and keeps a vault of OAuth logins. Offline and read-only."""
# A static binary: no shared libraries to depend on.
depends = ""
assets = [
    ["target/release/swarmy", "usr/bin/", "755"],
    ["dist/docs/swarmy.1.gz", "usr/share/man/man1/", "644"],
    ["dist/docs/completions/swarmy.bash", "usr/share/bash-completion/completions/swarmy", "644"],
    ["dist/docs/completions/_swarmy", "usr/share/zsh/vendor-completions/", "644"],
    ["dist/docs/completions/swarmy.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["README.md", "usr/share/doc/swarmy/", "644"],
    ["CHANGELOG.md", "usr/share/doc/swarmy/", "644"],
]

[package.metadata.generate-rpm]
license = "MIT OR Apache-2.0"
summary = "Real-time analytics dashboard for coding agents"
auto-req = "no"
assets = [
    { source = "target/release/swarmy", dest = "/usr/bin/swarmy", mode = "755" },
    { source = "dist/docs/swarmy.1.gz", dest = "/usr/share/man/man1/swarmy.1.gz", mode = "644", doc = true },
    { source = "dist/docs/completions/swarmy.bash", dest = "/usr/share/bash-completion/completions/swarmy", mode = "644" },
    { source = "dist/docs/completions/_swarmy", dest = "/usr/share/zsh/site-functions/_swarmy", mode = "644" },
    { source = "dist/docs/completions/swarmy.fish", dest = "/usr/share/fish/vendor_completions.d/swarmy.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/swarmy/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/swarmy/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/swarmy/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/swarmy/LICENSE-APACHE", mode = "644", doc = true },
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
